name: Actualizar noticias

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Correr el bot de noticias
        run: node scripts/fetch-news.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - name: Commitear data.json si cambió
        run: |
          git config user.name "agrocordobes-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/data.json
          git diff --staged --quiet || git commit -m "Actualización automática de noticias"
          git push

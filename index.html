<!DOCTYPE html>
<html lang="es-AR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agro Cordobés – Noticias al instante</title>
<meta name="description" content="Las principales noticias del agro y el campo de Córdoba, actualizadas todos los días.">
<link rel="icon" href="assets/favicon.png">
<style>
  :root {
    --verde: #3e9142;
    --verde-oscuro: #26312b;
    --gris-texto: #6b7066;
    --gris-borde: #e3e6dd;
    --fondo: #f5f6f2;
    --link: #1d6fa5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--fondo);
    color: #222;
  }

  main { max-width: 1080px; margin: 0 auto; padding: 12px 16px 30px; }

  /* Header: logo + fecha a la izquierda, banner de publicidad a la derecha.
     El menú de categorías (filtro) va debajo, ver .categorias. */
  .top-header {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .brand-block {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }
  .brand-block img { height: 44px; display: block; }
  .brand-date {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--verde-oscuro);
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  .cabecera-wrap {
    flex: 1;
    border: 1px solid var(--gris-borde);
    background: #fff;
    position: relative;
    min-height: 60px;
    overflow: hidden;
  }
  .cabecera-wrap a { display: block; height: 100%; }
  .cabecera-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Fila superior: primeras 2 notas + widgets de clima/dólar/granos.
     El ancho de la columna de widgets (330px) está pensado para que el
     widget del clima de Meteored (que viene con un tamaño fijo de 300px)
     entre completo, sin que el navegador lo recorte. */
  .top-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    align-items: start;
    gap: 12px;
    margin-bottom: 12px;
  }
  .top-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 820px) {
    .top-row { grid-template-columns: 1fr; }
    .widgets-col { flex-direction: row; flex-wrap: wrap; }
    .widgets-col .widget-box { flex: 1 1 220px; }
  }
  @media (max-width: 560px) {
    .top-cards { grid-template-columns: 1fr; }
    .widgets-col { flex-direction: column; }
    .widgets-col .widget-box { flex: 1 1 auto; }
    .top-header { flex-direction: column; }
    .cabecera-wrap { flex: none; width: 100%; min-height: 0; height: auto; }
    .cabecera-wrap img { height: auto; object-fit: contain; }
  }

  .widgets-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    /* La altura la fija JS (sincronizarAlturaWidgets), igualándola a la
       columna de las 2 notas destacadas, para que no quede un hueco vacío
       antes de la fila de 3 notas que sigue. Si los widgets no entran
       completos en esa altura, se scrollea esta columna sola. */
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .widget-box {
    background: #fff;
    border: 1px solid var(--gris-borde);
    border-radius: 4px;
    padding: 6px;
    text-align: center;
    flex: 1;
  }
  /* Los widgets externos (clima, TradingView) traen su propio tamaño y no
     hay que forzarlo, si no se recortan. Solo el de la cotización del
     dólar (que es un iframe simple, sin JS propio) se estira a propósito
     para ocupar todo el ancho disponible. */
  .widget-box iframe { border: 0; max-width: 100%; }
  .widget-box .dolar-frame { width: 100%; height: 150px; display: block; }

  /* Widget "Videos del campo": última subida de un par de canales de
     YouTube elegidos a mano (ver data/videos.json), no una búsqueda
     genérica — así se puede mezclar un canal de noticias con uno de humor,
     por ejemplo. A diferencia de los demás widget-box, este va con el
     texto alineado a la izquierda. Cada video se muestra como una tarjeta
     vertical (miniatura grande arriba, texto abajo), uno debajo del otro,
     del mismo estilo que una nota, en vez de una fila chica horizontal. */
  .widget-videos { text-align: left; }
  .widget-videos-titulo {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--verde-oscuro);
    padding: 2px 2px 6px;
    border-bottom: 1px solid var(--gris-borde);
    margin-bottom: 8px;
  }
  .video-item {
    display: block;
    text-decoration: none;
    color: inherit;
    padding-bottom: 10px;
  }
  .video-item + .video-item {
    border-top: 1px solid var(--gris-borde);
    margin-top: 10px;
    padding-top: 10px;
  }
  .video-thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .video-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video-play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-play::before {
    content: "▶";
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 15px;
    padding-left: 3px;
  }
  .video-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .video-titulo {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    color: #1a1a1a;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .video-canal { font-size: 11px; color: var(--gris-texto); }

  /* Grilla del resto de las notas */
  .grilla {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 820px) { .grilla { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .grilla { grid-template-columns: 1fr; } }

  /* Tarjeta: imagen + badge verde superpuesto, título/bajada abajo en blanco */
  .card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 1px solid var(--gris-borde);
    overflow: hidden;
  }
  .card-img-wrap {
    position: relative;
    aspect-ratio: 16/10;
    background: linear-gradient(160deg, #eef4ea, #f7f8f4);
    overflow: hidden;
  }
  .card-img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-img-wrap img.is-fallback { object-fit: contain; padding: 20%; }

  .card-badge {
    position: absolute;
    top: 8px; right: 8px;
    max-width: calc(100% - 16px);
    background: var(--verde);
    color: #fff;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 3px 8px;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Menú de navegación / filtro por categoría. Al tocar una categoría se
     filtran las notas de toda la página (destacadas + grilla) sin recargar. */
  .categorias {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 0 12px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--gris-borde);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .categorias::-webkit-scrollbar { display: none; }
  .cat-btn {
    flex-shrink: 0;
    border: 1px solid var(--gris-borde);
    background: #fff;
    color: var(--verde-oscuro);
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .cat-btn:hover { border-color: var(--verde); color: var(--verde); }
  .cat-btn.is-active {
    background: var(--verde);
    border-color: var(--verde);
    color: #fff;
  }

  .card-body { padding: 10px 12px 6px; flex: 1; }
  .card-titulo {
    margin: 0 0 6px;
    font-weight: 700;
    font-size: 14.5px;
    line-height: 1.3;
    color: #1a1a1a;
  }
  .card-excerpt {
    margin: 0 0 6px;
    font-size: 12.5px;
    color: #555;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-leer {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--link);
    text-decoration: none;
    margin-bottom: 8px;
  }
  .card-leer:hover { text-decoration: underline; }

  .card-fecha {
    border-top: 1px solid var(--gris-borde);
    padding: 6px 12px;
    font-size: 11px;
    color: var(--gris-texto);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .estado { text-align: center; padding: 40px 20px; color: var(--gris-texto); font-size: 14px; grid-column: 1 / -1; }

  footer {
    text-align: center;
    padding: 24px 20px 40px;
    font-size: 12px;
    color: var(--gris-texto);
  }
</style>
</head>
<body>

<main>
  <div class="top-header">
    <div class="brand-block">
      <img src="assets/logo.png" alt="Agro Cordobés">
      <span class="brand-date" id="brand-date"></span>
    </div>
    <div class="cabecera-wrap" id="cabecera"></div>
  </div>

  <nav class="categorias" id="categorias" aria-label="Filtrar noticias por categoría">
    <button type="button" class="cat-btn is-active" data-cat="Todas">Todas</button>
    <button type="button" class="cat-btn" data-cat="Agricultura">Agricultura</button>
    <button type="button" class="cat-btn" data-cat="Ganadería">Ganadería</button>
    <button type="button" class="cat-btn" data-cat="Mercados & Cotizaciones">Mercados &amp; Cotizaciones</button>
    <button type="button" class="cat-btn" data-cat="Clima">Clima</button>
    <button type="button" class="cat-btn" data-cat="Maquinaria">Maquinaria</button>
  </nav>

  <div class="top-row" id="top-row">
    <div class="top-cards" id="top-cards">
      <div class="estado">Cargando…</div>
    </div>
    <aside class="widgets-col">
      <div class="widget-box widget-videos" id="videos-widget-slot" style="display:none;">
        <div class="widget-videos-titulo">Videos del campo</div>
        <div id="videos-lista"></div>
      </div>
      <div class="widget-box">
        <div id="weather-widget-slot"><div id="mrwid88987d08777f05b0c1cecd3f092ab9d8"><script type="text/javascript" async src="https://api.meteored.com/widget/loader/88987d08777f05b0c1cecd3f092ab9d8"></script></div></div>
      </div>
      <div class="widget-box" style="padding:4px;">
        <iframe
          class="dolar-frame"
          src="https://www.cotizacion-dolar.com.ar/recursos-webmaster/promedios/cotizacion-argentina-adaptable.php"
          frameborder="0" scrolling="no" title="Cotización del dólar"></iframe>
      </div>
      <div class="widget-box" style="padding:4px;">
        <div class="tradingview-widget-container">
          <div class="tradingview-widget-container__widget"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/external-embedding/embed-widget-market-overview.js" async>
          {
          "colorTheme": "light",
          "dateRange": "12M",
          "showChart": false,
          "locale": "es",
          "largeChartUrl": "",
          "isTransparent": false,
          "showSymbolLogo": false,
          "showFloatingTooltip": false,
          "width": "100%",
          "height": "180",
          "plotLineColorGrowing": "rgba(62, 145, 66, 1)",
          "plotLineColorFalling": "rgba(62, 145, 66, 1)",
          "gridLineColor": "rgba(240, 243, 250, 0)",
          "scaleFontColor": "rgba(120, 123, 134, 1)",
          "belowLineFillColorGrowing": "rgba(62, 145, 66, 0.12)",
          "belowLineFillColorFalling": "rgba(62, 145, 66, 0.12)",
          "belowLineFillColorGrowingBottom": "rgba(62, 145, 66, 0)",
          "belowLineFillColorFallingBottom": "rgba(62, 145, 66, 0)",
          "symbolActiveColor": "rgba(62, 145, 66, 0.12)",
          "tabs": [
            {
              "title": "Granos (referencia)",
              "symbols": [
                { "s": "AMEX:SOYB", "d": "Soja" },
                { "s": "AMEX:CORN", "d": "Maíz" },
                { "s": "AMEX:WEAT", "d": "Trigo" }
              ],
              "originalTitle": "Granos"
            }
          ]
          }
          </script>
        </div>
      </div>
    </aside>
  </div>

  <div class="grilla" id="grilla"></div>
</main>

<footer>
  Agro Cordobés recopila automáticamente titulares del agro y el campo de Córdoba y enlaza a la fuente original.
  Ninguna nota se reproduce completa acá.
</footer>

<script>
let DATA = null;
let FILTRO_ACTIVO = "Todas";

async function cargarJSON(ruta) {
  const res = await fetch(ruta + "?v=" + Date.now());
  if (!res.ok) throw new Error("no se pudo cargar " + ruta);
  return res.json();
}

function formatearFecha(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
}

function imgOFallback(url) {
  const hasImage = Boolean(url);
  const src = hasImage ? url : "assets/logo.png";
  const cls = hasImage ? "" : "is-fallback";
  const onerror = `this.onerror=null;this.src='assets/logo.png';this.classList.add('is-fallback')`;
  return `<img src="${src}" alt="" loading="lazy" class="${cls}" onerror="${onerror}">`;
}

function tarjeta(n) {
  return `
    <a class="card" href="${n.link}" target="_blank" rel="noopener">
      <div class="card-img-wrap">
        ${imgOFallback(n.imagen)}
        <span class="card-badge">${n.categoria}</span>
      </div>
      <div class="card-body">
        <h3 class="card-titulo">${n.titulo}</h3>
        ${n.bajada ? `<p class="card-excerpt">${n.bajada}</p>` : ""}
        <span class="card-leer">LEER NOTA »</span>
      </div>
      <div class="card-fecha">${n.fuente ? n.fuente + " · " : ""}${formatearFecha(n.fecha)}</div>
    </a>`;
}

function pintarNotas() {
  if (!DATA) return;
  const linksTop = new Set(DATA.top3.map((n) => n.link));
  const todasSinFiltrar = [...DATA.top3, ...DATA.historial.filter((n) => !linksTop.has(n.link))];
  const todas =
    FILTRO_ACTIVO === "Todas"
      ? todasSinFiltrar
      : todasSinFiltrar.filter((n) => n.categoria === FILTRO_ACTIVO);

  const topCards = document.getElementById("top-cards");
  const grilla = document.getElementById("grilla");

  if (todas.length === 0) {
    topCards.innerHTML = `<div class="estado">${
      FILTRO_ACTIVO === "Todas"
        ? "Todavía no hay notas cargadas."
        : `Por ahora no hay notas de ${FILTRO_ACTIVO}.`
    }</div>`;
    grilla.innerHTML = "";
    return;
  }

  const primeras = todas.slice(0, 2);
  // La grilla de abajo tiene 3 columnas: si sobra 1 o 2 notas sueltas al
  // final, queda una fila incompleta y se ve vacía. Mejor recortarlas y
  // que siempre termine en una fila completa.
  const restoSinRecortar = todas.slice(2);
  const resto = restoSinRecortar.slice(
    0,
    restoSinRecortar.length - (restoSinRecortar.length % 3)
  );

  topCards.innerHTML = primeras.map(tarjeta).join("");

  grilla.innerHTML = resto.length
    ? resto.map(tarjeta).join("")
    : "";
}

function videoItem(v) {
  return `
    <a class="video-item" href="${v.link}" target="_blank" rel="noopener">
      <div class="video-thumb-wrap">
        <img src="${v.miniatura}" alt="" loading="lazy" onerror="this.closest('.video-item').remove()">
        <span class="video-play"></span>
      </div>
      <div class="video-info">
        <span class="video-titulo">${v.titulo}</span>
        <span class="video-canal">${v.canal}</span>
      </div>
    </a>`;
}

function pintarVideos() {
  const slot = document.getElementById("videos-widget-slot");
  const lista = document.getElementById("videos-lista");
  if (!slot || !lista) return;
  const videos = (DATA && DATA.videos) || [];
  if (videos.length === 0) {
    slot.style.display = "none";
    return;
  }
  slot.style.display = "";
  lista.innerHTML = videos.map(videoItem).join("");
}

// Le da a la columna de widgets (videos/clima/dólar/granos) el alto de las
// 2 notas destacadas de al lado MÁS la primera fila de la grilla de abajo,
// para que entren los 4 widgets sin tener que scrollear dentro de la
// columna (antes solo tomaba la altura de las 2 destacadas y los widgets
// de más abajo quedaban escondidos). Si aun así no entran, esta columna
// scrollea sola (ver overflow-y en .widgets-col).
function sincronizarAlturaWidgets() {
  const topCards = document.getElementById("top-cards");
  const widgetsCol = document.querySelector(".widgets-col");
  const grilla = document.getElementById("grilla");
  if (!topCards || !widgetsCol) return;
  // Debajo de 820px el layout pasa a una sola columna (ver @media): ahí los
  // widgets van en su propia fila y no hay que limitarles la altura.
  if (window.matchMedia("(max-width: 820px)").matches) {
    widgetsCol.style.maxHeight = "";
    return;
  }
  let alto = topCards.offsetHeight;
  if (grilla && grilla.children.length > 0) {
    const gapEntreFilas = 12; // mismo valor que margin-bottom de .top-row
    alto += gapEntreFilas + grilla.children[0].offsetHeight;
  }
  widgetsCol.style.maxHeight = alto > 0 ? alto + "px" : "";
}

async function iniciar() {
  pintarCabecera();
  try {
    DATA = await cargarJSON("data/data.json");
    pintarNotas();
    pintarVideos();
  } catch (err) {
    document.getElementById("top-cards").innerHTML = "";
    document.getElementById("grilla").innerHTML = `<div class="estado">No se pudo cargar las noticias. Probá recargar la página.</div>`;
    console.error(err);
  }
  sincronizarAlturaWidgets();
  // Las imágenes de las tarjetas cargan asíncronamente y pueden cambiar la
  // altura de top-cards después del primer cálculo; ResizeObserver lo
  // detecta y reajusta. También reajustamos si cambia el tamaño de ventana
  // (por si se cruza el breakpoint de 820px).
  const topCardsEl = document.getElementById("top-cards");
  if (topCardsEl && "ResizeObserver" in window) {
    new ResizeObserver(sincronizarAlturaWidgets).observe(topCardsEl);
  }
  window.addEventListener("resize", sincronizarAlturaWidgets);
}

async function pintarCabecera() {
  const cont = document.getElementById("cabecera");
  try {
    const { elementos } = await cargarJSON("data/cabecera.json");
    if (!elementos || elementos.length === 0) { cont.remove(); return; }
    let i = Math.floor(Math.random() * elementos.length);
    function render() {
      const b = elementos[i];
      cont.innerHTML = `<a href="${b.link}" target="_blank" rel="noopener sponsored"><img src="${b.imagen}" alt="${b.alt || ''}"></a>`;
    }
    render();
    if (elementos.length > 1) setInterval(() => { i = (i + 1) % elementos.length; render(); }, 8000);
  } catch {
    cont.remove();
  }
}

document.getElementById("categorias").addEventListener("click", (e) => {
  const btn = e.target.closest(".cat-btn");
  if (!btn) return;
  FILTRO_ACTIVO = btn.dataset.cat;
  document
    .querySelectorAll(".cat-btn")
    .forEach((b) => b.classList.toggle("is-active", b === btn));
  pintarNotas();
  sincronizarAlturaWidgets();
});

const dateEl = document.getElementById("brand-date");
if (dateEl) {
  dateEl.textContent = new Date().toLocaleString("es-AR", {
    day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit",
  }).toUpperCase();
}

iniciar();
</script>

</body>
</html>

<meta charset="UTF-8">

<title>Agro Cordobés – Noticias al instante</title>
<meta name="description" content="Las principales noticias del agro y el campo de Córdoba, actualizadas todos los días.">
<link rel="icon" href="assets/favicon.png">
<style>
  :root {
    --verde: #3e9142;
    --verde-oscuro: #26312b;
    --gris-texto: #6b7066;
    --gris-borde: #e3e6dd;
    --fondo: #f5f6f2;
    --link: #1d6fa5;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--fondo);
    color: #222;
  }

  main { max-width: 1080px; margin: 0 auto; padding: 12px 16px 30px; }

  /* Header: logo + fecha a la izquierda, banner de publicidad a la derecha.
     El menú de categorías (filtro) va debajo, ver .categorias. */
  .top-header {
    display: flex;
    gap: 10px;
    margin-bottom: 12px;
  }
  .brand-block {
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 2px;
  }
  /* El ancho del logo lo fija JS (ver el bloque de brand-date al final del
     script), igualándolo al ancho del texto de fecha/hora de abajo — que
     cambia de largo según el día — en vez de una altura fija chica. */
  .brand-block img { height: auto; width: 90px; max-width: 320px; display: block; }
  .brand-date {
    font-size: 10.5px;
    font-weight: 700;
    color: var(--verde-oscuro);
    letter-spacing: 0.2px;
    white-space: nowrap;
  }

  .cabecera-wrap {
    flex: 1;
    border: 1px solid var(--gris-borde);
    background: #fff;
    position: relative;
    min-height: 60px;
    overflow: hidden;
  }
  .cabecera-wrap a { display: block; height: 100%; }
  .cabecera-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Fila superior: notas destacadas (2, 4 o 6 según haga falta, ver
     ajustarFilasDestacadas() en el JS) + widgets de videos/clima/dólar/
     granos. El ancho de la columna de widgets (330px) está pensado para
     que el widget del clima de Meteored (que viene con un tamaño fijo de
     300px) entre completo, sin que el navegador lo recorte. */
  .top-row {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 330px;
    /* "stretch" (no "start"): si la columna de widgets es más baja que las
       notas destacadas de al lado, se estira para llenar el alto de la
       fila — y como cada .widget-box de adentro ya tiene flex:1, se reparte
       el espacio de más entre ellos en vez de dejar un hueco en blanco. */
    align-items: stretch;
    gap: 12px;
    margin-bottom: 12px;
  }
  .top-cards {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  @media (max-width: 820px) {
    .top-row { grid-template-columns: 1fr; }
    .widgets-col { flex-direction: row; flex-wrap: wrap; }
    .widgets-col .widget-box { flex: 1 1 220px; }
  }
  @media (max-width: 560px) {
    .top-cards { grid-template-columns: 1fr; }
    .widgets-col { flex-direction: column; }
    .widgets-col .widget-box { flex: 1 1 auto; }
    .top-header { flex-direction: column; }
    .cabecera-wrap { flex: none; width: 100%; min-height: 0; height: auto; }
    .cabecera-wrap img { height: auto; object-fit: contain; }
  }

  .widgets-col {
    display: flex;
    flex-direction: column;
    gap: 8px;
    /* La altura la iguala "align-items:stretch" en .top-row a la de las
       notas destacadas de al lado (ver ajustarFilasDestacadas() en el JS,
       que agranda esas notas si hace falta). overflow-y queda solo como
       resguardo por si algún widget externo midiera más de lo esperado. */
    overflow-y: auto;
    scrollbar-width: thin;
  }
  .widget-box {
    background: #fff;
    border: 1px solid var(--gris-borde);
    border-radius: 4px;
    padding: 6px;
    text-align: center;
    flex: 1;
  }
  /* Los widgets externos (clima, TradingView) traen su propio tamaño y no
     hay que forzarlo, si no se recortan. Solo el de la cotización del
     dólar (que es un iframe simple, sin JS propio) se estira a propósito
     para ocupar todo el ancho disponible. */
  .widget-box iframe { border: 0; max-width: 100%; }
  .widget-box .dolar-frame { width: 100%; height: 150px; display: block; }

  /* Widget "Videos del campo": última subida de un par de canales de
     YouTube elegidos a mano (ver data/videos.json), no una búsqueda
     genérica — así se puede mezclar un canal de noticias con uno de humor,
     por ejemplo. A diferencia de los demás widget-box, este va con el
     texto alineado a la izquierda. Cada video se muestra como una tarjeta
     vertical (miniatura grande arriba, texto abajo), uno debajo del otro,
     del mismo estilo que una nota, en vez de una fila chica horizontal. */
  .widget-videos { text-align: left; }
  .widget-videos-titulo {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--verde-oscuro);
    padding: 2px 2px 6px;
    border-bottom: 1px solid var(--gris-borde);
    margin-bottom: 8px;
  }
  .video-item {
    display: block;
    text-decoration: none;
    color: inherit;
    padding-bottom: 10px;
  }
  .video-item + .video-item {
    border-top: 1px solid var(--gris-borde);
    margin-top: 10px;
    padding-top: 10px;
  }
  .video-thumb-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #eee;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  .video-thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .video-play {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .video-play::before {
    content: "▶";
    display: flex;
    align-items: center;
    justify-content: center;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: rgba(0, 0, 0, 0.55);
    color: #fff;
    font-size: 15px;
    padding-left: 3px;
  }
  .video-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .video-titulo {
    font-size: 13px;
    font-weight: 700;
    line-height: 1.3;
    color: #1a1a1a;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .video-canal { font-size: 11px; color: var(--gris-texto); }

  /* Grilla del resto de las notas */
  .grilla {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  @media (max-width: 820px) { .grilla { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 560px) { .grilla { grid-template-columns: 1fr; } }

  /* Tarjeta: imagen + badge verde superpuesto, título/bajada abajo en blanco */
  .card {
    display: flex;
    flex-direction: column;
    text-decoration: none;
    color: inherit;
    background: #fff;
    border: 1px solid var(--gris-borde);
    overflow: hidden;
  }
  .card-img-wrap {
    position: relative;
    aspect-ratio: 16/10;
    background: linear-gradient(160deg, #eef4ea, #f7f8f4);
    overflow: hidden;
  }
  .card-img-wrap img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }
  .card-img-wrap img.is-fallback { object-fit: contain; padding: 20%; }

  .card-badge {
    position: absolute;
    top: 8px; right: 8px;
    max-width: calc(100% - 16px);
    background: var(--verde);
    color: #fff;
    font-size: 9.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    padding: 3px 8px;
    border-radius: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Menú de navegación / filtro por categoría. Al tocar una categoría se
     filtran las notas de toda la página (destacadas + grilla) sin recargar. */
  .categorias {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding: 2px 0 12px;
    margin-bottom: 10px;
    border-bottom: 1px solid var(--gris-borde);
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .categorias::-webkit-scrollbar { display: none; }
  .cat-btn {
    flex-shrink: 0;
    border: 1px solid var(--gris-borde);
    background: #fff;
    color: var(--verde-oscuro);
    font: inherit;
    font-size: 12.5px;
    font-weight: 700;
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s, color 0.15s, border-color 0.15s;
  }
  .cat-btn:hover { border-color: var(--verde); color: var(--verde); }
  .cat-btn.is-active {
    background: var(--verde);
    border-color: var(--verde);
    color: #fff;
  }

  .card-body { padding: 10px 12px 6px; flex: 1; }
  .card-titulo {
    margin: 0 0 6px;
    font-weight: 700;
    font-size: 14.5px;
    line-height: 1.3;
    color: #1a1a1a;
  }
  .card-excerpt {
    margin: 0 0 6px;
    font-size: 12.5px;
    color: #555;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-leer {
    display: inline-block;
    font-size: 12px;
    font-weight: 700;
    color: var(--link);
    text-decoration: none;
    margin-bottom: 8px;
  }
  .card-leer:hover { text-decoration: underline; }

  .card-fecha {
    border-top: 1px solid var(--gris-borde);
    padding: 6px 12px;
    font-size: 11px;
    color: var(--gris-texto);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .estado { text-align: center; padding: 40px 20px; color: var(--gris-texto); font-size: 14px; grid-column: 1 / -1; }

  footer {
    text-align: center;
    padding: 24px 20px 40px;
    font-size: 12px;
    color: var(--gris-texto);
  }
</style>
</head>

<script>
let DATA = null;
let FILTRO_ACTIVO = "Todas";

async function cargarJSON(ruta) {
  const res = await fetch(ruta + "?v=" + Date.now());
  if (!res.ok) throw new Error("no se pudo cargar " + ruta);
  return res.json();
}

function formatearFecha(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString("es-AR", { day: "numeric", month: "long", year: "numeric" });
}

function imgOFallback(url) {
  const hasImage = Boolean(url);
  const src = hasImage ? url : "assets/logo.png";
  const cls = hasImage ? "" : "is-fallback";
  const onerror = `this.onerror=null;this.src='assets/logo.png';this.classList.add('is-fallback')`;
  return `<img src="${src}" alt="" loading="lazy" class="${cls}" onerror="${onerror}">`;
}

function tarjeta(n) {
  return `
    <a class="card" href="${n.link}" target="_blank" rel="noopener">
      <div class="card-img-wrap">
        ${imgOFallback(n.imagen)}
        <span class="card-badge">${n.categoria}</span>
      </div>
      <div class="card-body">
        <h3 class="card-titulo">${n.titulo}</h3>
        ${n.bajada ? `<p class="card-excerpt">${n.bajada}</p>` : ""}
        <span class="card-leer">LEER NOTA »</span>
      </div>
      <div class="card-fecha">${n.fuente ? n.fuente + " · " : ""}${formatearFecha(n.fecha)}</div>
    </a>`;
}

// Cuántas notas van arriba, junto a los widgets, en la grilla de 2 columnas
// de .top-cards (2, 4 o 6 = 1, 2 o 3 filas). Arranca en 2 y la agranda
// ajustarFilasDestacadas() de a 2 si los widgets de al lado quedan más
// altos, para que no quede un hueco en blanco al costado.
let cantidadDestacadas = 2;
const MAX_DESTACADAS = 6;

function pintarNotas() {
  if (!DATA) return;
  const linksTop = new Set(DATA.top3.map((n) => n.link));
  const todasSinFiltrar = [...DATA.top3, ...DATA.historial.filter((n) => !linksTop.has(n.link))];
  const todas =
    FILTRO_ACTIVO === "Todas"
      ? todasSinFiltrar
      : todasSinFiltrar.filter((n) => n.categoria === FILTRO_ACTIVO);

  const topCards = document.getElementById("top-cards");
  const grilla = document.getElementById("grilla");

  if (todas.length === 0) {
    topCards.innerHTML = `<div class="estado">${
      FILTRO_ACTIVO === "Todas"
        ? "Todavía no hay notas cargadas."
        : `Por ahora no hay notas de ${FILTRO_ACTIVO}.`
    }</div>`;
    grilla.innerHTML = "";
    return;
  }

  const cantidad = Math.min(cantidadDestacadas, todas.length);
  const primeras = todas.slice(0, cantidad);
  // La grilla de abajo tiene 3 columnas: si sobra 1 o 2 notas sueltas al
  // final, queda una fila incompleta y se ve vacía. Mejor recortarlas y
  // que siempre termine en una fila completa.
  const restoSinRecortar = todas.slice(cantidad);
  const resto = restoSinRecortar.slice(
    0,
    restoSinRecortar.length - (restoSinRecortar.length % 3)
  );

  topCards.innerHTML = primeras.map(tarjeta).join("");

  grilla.innerHTML = resto.length
    ? resto.map(tarjeta).join("")
    : "";
}

function videoItem(v) {
  return `
    <a class="video-item" href="${v.link}" target="_blank" rel="noopener">
      <div class="video-thumb-wrap">
        <img src="${v.miniatura}" alt="" loading="lazy" onerror="this.closest('.video-item').remove()">
        <span class="video-play"></span>
      </div>
      <div class="video-info">
        <span class="video-titulo">${v.titulo}</span>
        <span class="video-canal">${v.canal}</span>
      </div>
    </a>`;
}

function pintarVideos() {
  const slot = document.getElementById("videos-widget-slot");
  const lista = document.getElementById("videos-lista");
  if (!slot || !lista) return;
  const videos = (DATA && DATA.videos) || [];
  if (videos.length === 0) {
    slot.style.display = "none";
    return;
  }
  slot.style.display = "";
  lista.innerHTML = videos.map(videoItem).join("");
}

// En vez de limitarle la altura a los widgets (clima/dólar/granos/videos) y
// hacerlos scrollear si no entran, agrandamos la cantidad de notas
// destacadas de arriba (de a 2, hasta 3 filas = 6 notas) para que la
// columna de notas quede tan alta como la de los widgets. Así no queda un
// hueco en blanco al costado y los widgets se ven completos siempre.
// Se llama de nuevo cada vez que cambia el alto de cualquiera de las 2
// columnas (clima/TradingView cargan de forma asíncrona y pueden variar su
// alto después del primer cálculo).
function ajustarFilasDestacadas() {
  const topCards = document.getElementById("top-cards");
  const widgetsCol = document.querySelector(".widgets-col");
  if (!topCards || !widgetsCol || !DATA) return;
  // Debajo de 820px el layout pasa a una sola columna (ver @media): ahí no
  // hay nada que igualar.
  if (window.matchMedia("(max-width: 820px)").matches) return;
  let intentos = 0;
  while (
    widgetsCol.offsetHeight > topCards.offsetHeight &&
    cantidadDestacadas < MAX_DESTACADAS &&
    intentos < 3
  ) {
    cantidadDestacadas += 2;
    pintarNotas();
    intentos++;
  }
}

async function iniciar() {
  pintarCabecera();
  try {
    DATA = await cargarJSON("data/data.json");
    pintarNotas();
    pintarVideos();
  } catch (err) {
    document.getElementById("top-cards").innerHTML = "";
    document.getElementById("grilla").innerHTML = `<div class="estado">No se pudo cargar las noticias. Probá recargar la página.</div>`;
    console.error(err);
  }
  ajustarFilasDestacadas();
  // Las imágenes de las tarjetas y los widgets externos (clima, TradingView)
  // cargan asíncronamente y pueden cambiar de altura después del primer
  // cálculo; ResizeObserver detecta esos cambios en cualquiera de las 2
  // columnas y vuelve a ajustar. También reajustamos si cambia el tamaño de
  // ventana (por si se cruza el breakpoint de 820px).
  const topCardsEl = document.getElementById("top-cards");
  const widgetsColEl = document.querySelector(".widgets-col");
  if ("ResizeObserver" in window) {
    if (topCardsEl) new ResizeObserver(ajustarFilasDestacadas).observe(topCardsEl);
    if (widgetsColEl) new ResizeObserver(ajustarFilasDestacadas).observe(widgetsColEl);
  }
  window.addEventListener("resize", ajustarFilasDestacadas);
}

async function pintarCabecera() {
  const cont = document.getElementById("cabecera");
  try {
    const { elementos } = await cargarJSON("data/cabecera.json");
    if (!elementos || elementos.length === 0) { cont.remove(); return; }
    let i = Math.floor(Math.random() * elementos.length);
    function render() {
      const b = elementos[i];
      cont.innerHTML = `<a href="${b.link}" target="_blank" rel="noopener sponsored"><img src="${b.imagen}" alt="${b.alt || ''}"></a>`;
    }
    render();
    if (elementos.length > 1) setInterval(() => { i = (i + 1) % elementos.length; render(); }, 8000);
  } catch {
    cont.remove();
  }
}

document.getElementById("categorias").addEventListener("click", (e) => {
  const btn = e.target.closest(".cat-btn");
  if (!btn) return;
  FILTRO_ACTIVO = btn.dataset.cat;
  document
    .querySelectorAll(".cat-btn")
    .forEach((b) => b.classList.toggle("is-active", b === btn));
  // Al cambiar de categoría cambia la lista de notas disponibles, así que
  // arrancamos de nuevo con 1 sola fila destacada y dejamos que
  // ajustarFilasDestacadas() la agrande si hace falta.
  cantidadDestacadas = 2;
  pintarNotas();
  ajustarFilasDestacadas();
});

const dateEl = document.getElementById("brand-date");
if (dateEl) {
  dateEl.textContent = new Date().toLocaleString("es-AR", {
    day: "numeric", month: "long", year: "numeric", hour: "numeric", minute: "2-digit",
  }).toUpperCase();
  // El logo se agranda para que ocupe un poco más que el ancho del texto de
  // fecha/hora de abajo (en vez de quedar chico con una altura fija), así
  // se ajusta solo aunque cambie el largo del texto según el día.
  const logoEl = document.getElementById("brand-logo");
  if (logoEl) {
    const anchoFecha = dateEl.offsetWidth;
    if (anchoFecha > 0) logoEl.style.width = Math.round(anchoFecha * 1.25) + "px";
  }
}

iniciar();
</script>

</html>
